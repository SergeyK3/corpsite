# Install only after DNS and TLS certificate are ready.
server {
    listen 80;
    server_name learn.mmc.004.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name learn.mmc.004.kz;
    ssl_certificate /etc/letsencrypt/live/learn.mmc.004.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.mmc.004.kz/privkey.pem;
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
